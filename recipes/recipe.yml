# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: tdk-zweej
# Change this to your own image name
description: My personal atomic Linux distro based on Kinoite

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  # ---------------------------------------------------------------------
  # Desktop session essentials
  # zsh is made the default login shell by set-default-shell-zsh.service;
  # direnv and starship are initialized by zsh-extras.service.
  # ---------------------------------------------------------------------
  - type: dnf
    repos:
      files:
        - https://packages.microsoft.com/yumrepos/vscode/config.repo
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
    install:
      packages:
        - emacs
        - code
        - zsh
        - direnv
        - zoxide

  # ---------------------------------------------------------------------
  # Node.js — required only by pi-installer.service (Pi's installer needs
  # Node.js 22.19+ and npm; Pi itself is not baked in). Fedora 44 splits Node
  # into parallel-installable version streams, and only the -bin subpackages
  # put /usr/bin/node and /usr/bin/npm/npx on PATH.
  # ---------------------------------------------------------------------
  - type: dnf
    install:
      packages:
        - nodejs24-bin
        - nodejs24-npm-bin

  # ---------------------------------------------------------------------
  # Local Kubernetes development
  # Podman is provided by the uBlue base image. kind uses it rootlessly,
  # so no Docker daemon or host-level Kubernetes service is needed.
  # ---------------------------------------------------------------------
  - type: dnf
    install:
      packages:
        - kind
        - kubernetes-client # kubectl
        - helm
        - k9s
        - kustomize
        - yq

  # kubectx and stern are not packaged in Fedora 44. Pin and verify upstream
  # releases so image builds stay reproducible instead of skipping them.
  - type: containerfile
    snippets:
      - >-
        RUN curl -fsSL -o /usr/bin/kubectx https://github.com/ahmetb/kubectx/releases/download/v0.11.0/kubectx
        && echo '1905c04422efe305d5b27f7526c3573a8c00b9e291e825dba6dd8a5350d59037  /usr/bin/kubectx' | sha256sum --check
        && chmod 0755 /usr/bin/kubectx
      - >-
        RUN curl -fsSL -o /usr/bin/kubens https://github.com/ahmetb/kubectx/releases/download/v0.11.0/kubens
        && echo 'bf81b4a515e96bfb1878e3b85950bd5742d96a5d6b398e737495ab1b3972ef70  /usr/bin/kubens' | sha256sum --check
        && chmod 0755 /usr/bin/kubens
      - >-
        RUN curl -fsSL -o /tmp/stern.tar.gz https://github.com/stern/stern/releases/download/v1.34.0/stern_1.34.0_linux_amd64.tar.gz
        && echo '7754adfa653939240f7d20fff4ada9b69cda40c9e70732301f67bb8045f1ef3e  /tmp/stern.tar.gz' | sha256sum --check
        && tar -xzf /tmp/stern.tar.gz -C /usr/bin stern
        && rm /tmp/stern.tar.gz

  # ---------------------------------------------------------------------
  # Sublime Text + Sublime Merge
  # ---------------------------------------------------------------------
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://download.sublimetext.com/rpm/stable/x86_64/sublime-text.repo
      keys:
        - https://download.sublimetext.com/sublimehq-rpm-pub.gpg
    install:
      packages:
        - sublime-text
        - sublime-merge

  # ---------------------------------------------------------------------
  # Steam + Signal + Slack + Spotify + Obsidian — via Flatpak. uBlue base images already ship
  # the system Flathub remote, so this just adds them to it (installed +
  # updated on boot, not tied to the OS image build).
  # Note: com.slack.Slack is community-packaged on Flathub, not published
  # directly by Slack.
  # ---------------------------------------------------------------------
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.valvesoftware.Steam
          - org.signal.Signal
          - com.slack.Slack
          - com.spotify.Client
          - md.obsidian.Obsidian

  # ---------------------------------------------------------------------
  # VLC + Kdenlive — native RPMs, deliberately not Flatpak. Both are in
  # Fedora's own repos at current upstream versions, and the image already
  # carries the full ffmpeg stack they use. Kinoite's Qt6/KF6 runtime is
  # already present, so the marginal size is small. The Flatpaks would
  # additionally pull the KDE 5.15 (VLC) and 6.10 (Kdenlive) runtimes for
  # no version benefit.
  # ---------------------------------------------------------------------
  - type: dnf
    install:
      packages:
        - vlc
        - kdenlive

  # ---------------------------------------------------------------------
  # H.264 for Firefox — the base image ships noopenh264, a stub library
  # that decodes nothing, so Firefox can't play H.264 video. Installing
  # openh264 (Cisco's real codec, from the fedora-cisco-openh264 repo
  # that ships enabled in Fedora's fedora-repos package) Obsoletes
  # noopenh264, so dnf replaces the stub in the same transaction — the
  # build-time equivalent of `rpm-ostree override remove noopenh264
  # --install openh264 ...` on a live system. mozilla-openh264 is the
  # Firefox GMP plugin wrapper that loads the codec (it hard-requires
  # openh264, so installing it alone is enough for Firefox);
  # gstreamer1-plugin-openh264 covers H.264 in GStreamer apps and lives
  # in the main fedora repo.
  # ---------------------------------------------------------------------
  - type: dnf
    install:
      packages:
        - openh264
        - mozilla-openh264
        - gstreamer1-plugin-openh264

  # ---------------------------------------------------------------------
  # LibreOffice — Writer + Calc only, native RPMs. Same reasoning as
  # VLC/Kdenlive: Fedora's own repos at current upstream versions, no
  # third-party repo to maintain, and the Flatpak would pull the ~500 MiB
  # freedesktop.org runtime the image doesn't otherwise carry (Kinoite
  # only ships KDE runtimes). Writer + Calc cover reading/editing docx
  # and xlsx; no Impress/Base/Draw, so no bloat beyond what's asked for.
  # Weak deps off: they'd add libreoffice-help-en (+~30 MiB) plus a pile
  # of dictionaries, langpacks and assorted GUI extras. Measured in a
  # Fedora 44 container: 11 packages, ~346 MiB installed, dominated by
  # libreoffice-core (~303 MiB). libreoffice-kf6 is the Qt6/KF6 VCL
  # plugin, so LO renders with native KDE dialogs and widget style — the
  # base image's Qt6/KF6 runtime is already present.
  # Headless use works out of the box: soffice --headless --convert-to.
  # ---------------------------------------------------------------------
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - libreoffice-writer
        - libreoffice-calc
        - libreoffice-kf6

  # ---------------------------------------------------------------------
  # kitty — native RPM from Fedora's own repos. The RPM ships both `kitty`
  # and `kitten` plus a desktop entry, so it lands in the app menu as-is.
  # Fedora tracks upstream closely; the image already carries the fonts and
  # GL stack it wants, so the marginal size is the package itself.
  # ---------------------------------------------------------------------
  - type: dnf
    install:
      packages:
        - kitty

  # ---------------------------------------------------------------------
  # nushell -- pinned upstream release, deliberately NOT the Fedora package.
  # Fedora's `nushell` is still 0.99.1 in both F44 and F45, while upstream
  # is at 0.116.1 (Oct 2026) -- roughly a year and 17 releases of a shell
  # whose config and command surface keep moving, so the RPM would be a
  # stale shell that no longer matches the docs. Pin and verify instead
  # (same approach as kubectx/stern above), against the hash nushell
  # publishes in its own SHA256SUMS rather than a self-computed one.
  # The gnu build's only shared libs are libz, libgcc_s, libm and libc --
  # all already in the image, no openssl/ldap stack needed. The tarball
  # also ships nu_plugin_*; only `nu` is installed here, so add them to the
  # tar member list below if you want `plugin add` targets.
  # Bumping: change the version in all four places (URL x2, tar member,
  # install source) plus the hash, from SHA256SUMS on the release page.
  # ---------------------------------------------------------------------
  - type: containerfile
    snippets:
      - >-
        RUN curl -fsSL -o /tmp/nu.tar.gz https://github.com/nushell/nushell/releases/download/0.116.1/nu-0.116.1-x86_64-unknown-linux-gnu.tar.gz
        && echo 'd6d8ace4be491ed8abba4026e73b60c0470b4671d7039307e7d772282ef863da  /tmp/nu.tar.gz' | sha256sum --check
        && tar -xzf /tmp/nu.tar.gz -C /tmp nu-0.116.1-x86_64-unknown-linux-gnu/nu
        && install -Dm0755 /tmp/nu-0.116.1-x86_64-unknown-linux-gnu/nu /usr/bin/nu
        && rm -rf /tmp/nu.tar.gz /tmp/nu-0.116.1-x86_64-unknown-linux-gnu

  # ---------------------------------------------------------------------
  # kanata — key remapper for home-row mods.
  # Not in Fedora's own repos, so pin and verify the upstream release binary
  # (same approach as kubectx/stern above) rather than adding a third-party
  # repo or COPR for it.
  # From linux-binaries-x64.zip we install `kanata_linux_x64` — the build
  # WITHOUT the `cmd` feature, so key remaps can never shell out.
  # The udev rule at files/system/etc/udev/rules.d/70-keychron-uaccess.rules
  # grants the active user access to Keychron keyboards so kanata can read
  # them without needing the `input` group. It must keep the `70-` prefix so
  # it runs before 71-seat.rules, which turns the `uaccess` tag into a
  # logind-managed ACL.
  # ---------------------------------------------------------------------
  - type: dnf
    install:
      packages:
        - unzip # unpack the pinned kanata release zip below
  - type: containerfile
    snippets:
      - >-
        RUN curl -fsSL -o /tmp/kanata.zip https://github.com/jtroo/kanata/releases/download/v1.12.0/linux-binaries-x64.zip
        && echo '0bedd91567c5d7c54679061baadc37e4f83fb71750003999bc1d11f2c9754f36  /tmp/kanata.zip' | sha256sum --check
        && unzip -j -o /tmp/kanata.zip kanata_linux_x64 -d /tmp/kanata-bin
        && install -Dm0755 /tmp/kanata-bin/kanata_linux_x64 /usr/bin/kanata
        && rm -rf /tmp/kanata.zip /tmp/kanata-bin

  # ---------------------------------------------------------------------
  # Brave Browser + 1Password (desktop app + CLI)
  # ---------------------------------------------------------------------
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        - 1password.repo # from ./files/dnf/1password.repo in this repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
        - https://downloads.1password.com/linux/keys/1password.asc
    install:
      packages:
        - liberation-fonts-all # provides the legacy liberation-fonts dependency
        - repo: brave-browser
          packages:
            - brave-browser
        - 1password
        - 1password-cli

  # ---------------------------------------------------------------------
  # Dropbox — client + tray icon (no nautilus needed to run it; that
  # naming is just legacy upstream). Autostarted via dropbox.service
  # below since the RPM only provides the CLI wrapper, not an autostart.
  # ---------------------------------------------------------------------
  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        - nautilus-dropbox

  # ---------------------------------------------------------------------
  # starship prompt + uupd
  # (starship comes via COPR — Fedora dropped its own package after F36;
  # atim/starship is the standard place to get it now. uupd is Universal
  # Blue's unified OS image + Flatpak updater.)
  # ---------------------------------------------------------------------
  - type: dnf
    repos:
      copr:
        - atim/starship
        - ublue-os/packages
    install:
      packages:
        - starship
        - uupd

  # Fedora Atomic images cannot create new top-level directories after boot.
  # Keep an empty mount point in the image so the OSTree Nix installer can
  # bind-mount its persistent store from /var/home/nix.
  - type: containerfile
    snippets:
      - RUN mkdir -p /nix && chmod 000 /nix

  # ---------------------------------------------------------------------
  # Tailscale
  # ---------------------------------------------------------------------
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    install:
      packages:
        - tailscale

  # ---------------------------------------------------------------------
  # goose (AI agent) — desktop GUI and CLI are installed two different ways.
  #
  # Desktop: upstream publishes it only as a GitHub release asset (no dnf
  # repo, no Flathub listing, and the RPM is unsigned). No version is
  # pinned: each build resolves the newest upstream release, so a nightly
  # rebuild (CI + uupd) is what advances the GUI. The tag comes from the
  # /releases/latest redirect rather than the GitHub API, so nightly CI
  # never trips the 60-requests/hour unauthenticated rate limit.
  # Nothing can be verified against a known-good hash — upstream publishes
  # no checksums — so the SHA-256 of the downloaded RPM is echoed into the
  # build log instead, which keeps it auditable. Trade-off worth knowing:
  # builds are no longer bit-reproducible against a fixed goose version. If
  # that ever matters more than tracking upstream, pin again by putting the
  # version in the URL plus a `sha256sum --check` line (as kubectx/stern/
  # kanata above do).
  # The asset name embeds the version (Goose-<ver>-1.x86_64.rpm), so if
  # upstream changes its packaging the build fails loudly rather than
  # silently shipping something stale.
  # dnf resolves the rest: gtk3, nss, at-spi2-core, libdrm, xdg-utils,
  # libnotify, libxcb and mesa-libgbm — all already present in this image.
  # The RPM ships /usr/bin/Goose plus
  # /usr/share/applications/Goose.desktop, so it lands in the app menu.
  # Cost: ~146 MiB download, ~515 MiB installed (Electron). The -vulkan
  # variant is a separate asset; this is the standard build.
  #
  # CLI: NOT baked in — goose-installer.service (a user unit, below) runs
  # upstream's download_cli.sh on first login. Same reasoning as Zed /
  # opencode / Pi further down: it is a per-user install that self-updates
  # via `goose update`, which needs to rewrite its own binary and therefore
  # cannot live under the read-only /usr.
  # ---------------------------------------------------------------------
  - type: containerfile
    snippets:
      - >-
        RUN GOOSE_TAG=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/aaif-goose/goose/releases/latest | sed 's|.*/tag/||')
        && GOOSE_VER=${GOOSE_TAG#v}
        && GOOSE_URL="https://github.com/aaif-goose/goose/releases/download/$GOOSE_TAG/Goose-$GOOSE_VER-1.x86_64.rpm"
        && curl -fsSL -o /tmp/goose.rpm "$GOOSE_URL"
        && echo "goose $GOOSE_TAG sha256: $(sha256sum /tmp/goose.rpm | cut -d' ' -f1)"
        && dnf -y install /tmp/goose.rpm
        && dnf clean all
        && rm -f /tmp/goose.rpm

  # ---------------------------------------------------------------------
  # Config overrides and helper scripts shipped into their target directories
  # (see files/system/). Keep these as separate copies because /usr/local is a
  # special path in the base image and cannot be written by this module.
  # - rpm-ostreed.conf: turn off rpm-ostreed's own AutomaticUpdatePolicy
  #   so it doesn't race/duplicate with uupd's own staging of OS updates
  # ---------------------------------------------------------------------
  - type: files
    files:
      - source: system/etc
        destination: /etc
      - source: system/usr/bin
        destination: /usr/bin

  # ---------------------------------------------------------------------
  # Enable services
  # (The determinate-nix-installer.service, zed-installer.service,
  # opencode-installer.service, pi-installer.service,
  # goose-installer.service, dropbox.service,
  # set-default-shell-zsh.service, zsh-extras.service, and nu-extras.service
  # units live under files/systemd/{system,user}/ — the systemd module
  # below picks them up automatically and copies them into
  # /usr/lib/systemd/{system,user}/)
  # ---------------------------------------------------------------------
  - type: systemd
    system:
      enabled:
        - tailscaled.service
        - determinate-nix-installer.service # runs on boot, skips itself once /nix exists
        - uupd.timer # daily-ish OS image + Flatpak updates
        - set-default-shell-zsh.service # runs every boot, no-op once already on zsh
      disabled:
        - rpm-ostreed-automatic.timer # superseded by uupd — avoid double updates
      masked:
        - bootc-fetch-apply-updates.service # same reason — uupd is the single update path
    user:
      enabled:
        - zed-installer.service # runs on login, skips itself once ~/.local/bin/zed exists
        - opencode-installer.service # runs on login, skips itself once ~/.opencode/bin/opencode exists
        - pi-installer.service # runs on login, skips itself once ~/.pi/agent/bin/pi exists; uses the image's Node.js
        - goose-installer.service # runs on login, skips itself once ~/.local/bin/goose exists; Desktop comes from the RPM
        - dropbox.service # starts the sync daemon + tray icon on login
        - zsh-extras.service # direnv hook, starship init line, atuin — first login only
        - nu-extras.service # starship autoload for nu — regenerated when nu or starship changes

  # ---------------------------------------------------------------------
  # Final signing module — must be last
  # ---------------------------------------------------------------------
  - type: signing
